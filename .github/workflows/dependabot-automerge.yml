name: Dependabot auto-merge

# Enables GitHub's auto-merge on Dependabot PRs for non-major updates. The PR
# merges only once every required status check (the CI workflow) passes, so
# "Allow auto-merge" must be on in repo settings and `main` needs a branch
# protection rule requiring the "Typecheck, build and e2e" check.
#
# Merges enabled with GITHUB_TOKEN do not trigger other workflows, so the Pages
# deploy would not run after an auto-merge. Add a fine-grained PAT with
# contents:write and pull_requests:write as the AUTOMERGE_TOKEN secret to fix that.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Leave a note on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr comment "$PR_URL" --body "Major version bump, not auto-merged. Review and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
